{% extends "template2.html" %}
{% block content %}

<meta name="csrf-token" content="{{ csrf_token() }}">

<div class="container" style="text-align:center;">
  <img id="person_image" src={{person.image}} alt="person">
  <div class="text">
    <h4><b id="person_name">{{person.name }}</b> <b id="person_surname">{{person.surname}}</b></h4>
    <!-- <p class="marker" id="person_name"><i class="fa fa-imdb" aria-hidden="true"></i>{{person.name}}</p> -->
    <!--<p class="marker" id="person_surname"><i class="fa fa-calendar" aria-hidden="true"></i>{{person.surname}}</p> -->
    <!-- <p class="marker" id="person_sex"><i class="fa fa-film" aria-hidden="true"></i>{{person.sex}}</p> -->

    <!-- VK link Button-->
    <a id="person_vk_button" class="btn btn-block btn-social btn-vk" src="{{ url_for('static', filename='images/vk.png') }}" onclick="window.open('https://vk.com/id{{person.id}}', '_blank')" target='0'>
      <span class="fa fa-vk fa-2x"></span>
    </a>
    <!-- end VK link Button-->

    <hr>
    <!-- <p id="person_description">{{person.description}}</p> -->
  </div>
</div>

<script>const MODEL_URL = "{{ url_for('static', filename='model2/model.json') }}"</script>
<script src="{{ url_for('static', filename='js/model.js') }}"></script>

{% endblock %}
