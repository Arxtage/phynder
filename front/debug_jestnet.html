<!doctype html>
<html>
    <head></head>
    <style>
    body {
        font-family: "Roboto", "Helvetica", "Arial", sans-serif;
        margin-top: 50px;
        margin-left: 50px;
    }
    </style>
    <body>
        <h1>TensorFlow.js: gesture recognition</h1>
        <div class="webcam-box-outer">
            <div class="webcam-box-inner">
                <video autoplay playsinline muted id="webcam" width="224" height="224"></video>
            </div>
        </div>
    </body>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@2.0.0/dist/tf.min.js"></script>
<!--     <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/mobilenet@1.0.0"> </script> -->
<!--     <script src="https://cdn.jsdelivr.net/npm/onnxjs/dist/onnx.min.js"></script> -->
    <script>
        const MODEL_PATH = '../convert/models/keras_tsm_graph/model.json'
        const CATEGORIES = [
            "Doing other things",  // 0
            "Drumming Fingers",    // 1
            "No gesture",          // 2
            "Pulling Hand In",     // 3
            "Pulling Two Fingers In",    // 4
            "Pushing Hand Away",         // 5
            "Pushing Two Fingers Away",  // 6
            "Rolling Hand Backward",  // 7
            "Rolling Hand Forward",   // 8
            "Shaking Hand",           // 9
            "Sliding Two Fingers Down",   // 10
            "Sliding Two Fingers Left",   // 11
            "Sliding Two Fingers Right",  // 12
            "Sliding Two Fingers Up",     // 13
            "Stop Sign",      // 14
            "Swiping Down",   // 15
            "Swiping Left",   // 16
            "Swiping Right",  // 17
            "Swiping Up",  // 18
            "Thumb Down",  // 19
            "Thumb Up",    // 20
            "Turning Hand Clockwise",         // 21
            "Turning Hand Counterclockwise",  // 22
            "Zooming In With Full Hand",      // 23
            "Zooming In With Two Fingers",    // 24
            "Zooming Out With Full Hand",     // 25
            "Zooming Out With Two Fingers"    // 26
        ];
        const ILLEGAL_ACTIONS = [7, 8, 21, 22, 3];
        const HISTORY_LOGIT = true;
        const REFINE_OUTPUT = true;
        
        async function getProcessedFrame(channels_format) {
            /**
             * Captures a frame from the webcam and normalizes it between -1 and 1.
             * Returns a batched image (1-element batch) of shape [1, w, h, c].
             */
            const img = await webcam.capture();  // (224, 224, 3) 0 ~ 255
            if (channels_format == 'channels_first') {
                const processedImg =
                  tf.tidy(() => img.transpose([2, 0, 1]).expandDims(0).toFloat().div(255));  // (1, 3, 224, 224) 0 ~ 1.0
                img.dispose();
                return processedImg;
            } else {
                const processedImg =
                  tf.tidy(() => img.expandDims(0).toFloat().div(255));  // (1, 224, 224, 3) 0 ~ 1.0
                img.dispose();
                return processedImg;
            }
        }
        
        async function asyncForEach(array, callback) {
            for (let index = 0; index < array.length; index++) {
                await callback(array[index], index, array);
            }
        }
        
        function print_order_id(item) {
          if (item.length == 1) {
              console.log(0);
          } else {
               item[1].array().then(array => console.log(array[0][0][0][0]));
          }
        }
        
        async function process_output(idx_, history) {
            // idx_: the output of current frame
            // history: a list containing the history of predictions
            max_hist_len = 20;  // max history buffer
            // mask out illegal action
            if (ILLEGAL_ACTIONS.includes(idx_)) {
                idx_ = history.slice(-1)[0];
            }
            // use only single no action class
            if (idx_ == 0) {
                idx_ = 2;
            }
            // history smoothing
            if (idx_ != history.slice(-1)[0]) {
                if (history.slice(-1)[0] != history.slice(-2)[0]) {  // and history[-2] == history[-3]):
                    idx_ = history.slice(-1)[0];
                }
            }
            history.push(idx_);
            history = history.slice(-max_hist_len);
            return history;
        }
        
        async function predict() {
            try {
                webcam = await tf.data.webcam(document.getElementById('webcam'));
            } catch (e) {
                console.log(e);
                document.getElementById('no-webcam').style.display = 'block';
            }
            const keras_tsm_graph = await tf.loadGraphModel(MODEL_PATH);
            buffer = {
                0: tf.ones([1, 3, 55, 55]).transpose([0, 2, 3, 1]),
                1: tf.ones([1, 4, 27, 27]).transpose([0, 2, 3, 1]),
                2: tf.ones([1, 4, 27, 27]).transpose([0, 2, 3, 1]),
                3: tf.ones([1, 8, 13, 13]).transpose([0, 2, 3, 1]),
                4: tf.ones([1, 8, 13, 13]).transpose([0, 2, 3, 1]),
                5: tf.ones([1, 8, 13, 13]).transpose([0, 2, 3, 1]),
                6: tf.ones([1, 12, 13, 13]).transpose([0, 2, 3, 1]),
                7: tf.ones([1, 12, 13, 13]).transpose([0, 2, 3, 1]),
                8: tf.ones([1, 20, 6, 6]).transpose([0, 2, 3, 1]),
                9: tf.ones([1, 20, 6, 6]).transpose([0, 2, 3, 1])
            }  // SPATIAL SHAPES WERE DECREASED BY 1 !!!
            var jest_id = 2;
            var history = [2, 2];
            var history_logit = [];
            
            async function rewrite_buffer(item) {
                if (item.shape.length == 2) {
                    jest_id = await item.argMax(axis=1).array();
                    if (HISTORY_LOGIT) {
                        history_logit.push(item);
                        history_logit = history_logit.slice(-12);
                        avg_logit = history_logit.reduce(function(a, b){
                            return a.add(b);
                        });
                        jest_id = await avg_logit.argMax(axis=1).array();
                    }
                } else if (item.shape.length == 4) {
                    const [buf, order_id] = tf.split(item, [item.shape[3]-1, 1], 3);
                    const order_id_value = await order_id.array();
//                         console.log(order_id_value[0][0][0][0]);  // debug
                    buffer[order_id_value[0][0][0][0]-1] = buf;
                }
            }
            
            // Runtime loop
            const predicting = true;
            var i_frame = 0;
            while (predicting) {
//                 console.time('keras_tsm_graph.predict()');
                const img = await getProcessedFrame(channels_format='channels_last');
                if (i_frame % 2 == 0) {  // skip every other frame to obtain a suitable frame rate
                    const input_tensors = {
                        'i0': img,
                        'i1': buffer[0],
                        'i2': buffer[1],
                        'i3': buffer[2],
                        'i4': buffer[3],
                        'i5': buffer[4],
                        'i6': buffer[5],
                        'i7': buffer[6],
                        'i8': buffer[7],
                        'i9': buffer[8],
                        'i10': buffer[9],
                    }
                    const preds = keras_tsm_graph.predict(input_tensors);
//                     console.timeEnd('keras_tsm_graph.predict()');  // prints ~8-20 ms
                    const start = async () => { await asyncForEach(preds, rewrite_buffer); }  // !!! takes 100ms...
                    await start(); 
                    if (REFINE_OUTPUT) {
                        history = await process_output(jest_id, history);
                        jest_id = history.slice(-1)[0];
                    }
                    console.log(CATEGORIES[jest_id]);
                }
                img.dispose();
                await tf.nextFrame();
                i_frame += 1;
//                 console.timeEnd('keras_tsm_graph.predict()');  // prints ~100-150 ms
            }
        }
        // http://127.0.0.1:8080/front/debug_jestnet.html
        predict();
    
    </script>
</html>
