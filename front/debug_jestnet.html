    <script>
        async function runONNX() {
            const session = new onnx.InferenceSession();
            // load the ONNX model file
            const MODEL_ONNX = '../convert/models/mv2_simple.onnx';
//             const img = await getProcessedFrame();
            const tensorX = new onnx.Tensor(new Float32Array(1 * 3 * 224 * 224), 'float32', [1, 3, 224, 224])
            await session.loadModel(MODEL_ONNX);
            for (var i = 0; i < 100; ++i) {
                console.time('myOnnxSession');
                const outputMap = await session.run([tensorX]);
                console.timeEnd('myOnnxSession');
                console.log(outputMap.get("o0"));
            }
        }

        async function loadJestNet() {

            console.log('JestNet loaded');
            console.log(model);
            return model;

        async function getProcessedFrame(channels_format) {
            /**
             * Captures a frame from the webcam and normalizes it between -1 and 1.
             * Returns a batched image (1-element batch) of shape [1, w, h, c].
             */
            const img = await webcam.capture();  // (224, 224, 3) 0 ~ 255
            if (channels_format == 'channels_first') {
                const processedImg =
                  tf.tidy(() => img.transpose([2, 0, 1]).expandDims(0).toFloat().div(255));  // (1, 3, 224, 224) 0 ~ 1.0
                img.dispose();
                return processedImg;
            } else {
                const processedImg =
                  tf.tidy(() => img.expandDims(0).toFloat().div(255));  // (1, 224, 224, 3) 0 ~ 1.0
                img.dispose();
                return processedImg;
            }
        }
        
        async function asyncForEach(array, callback) {
            for (let index = 0; index < array.length; index++) {
                await callback(array[index], index, array);
            }
        }
